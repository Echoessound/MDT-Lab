name: MDT Lab checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[api,dev]'
      - run: docker compose up -d --wait mongodb
      - run: python -m pytest -q
        env:
          MDT_TEST_MONGODB_URI: mongodb://127.0.0.1:27018/?replicaSet=mdt-rs&directConnection=true
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
