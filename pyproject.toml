[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdt-demo"
version = "0.3.0"
description = "Synthetic-case MDT workflow demo with bounded discussion and audit logs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3", "python-dotenv>=1,<2", "pymongo>=4.10,<5", "cryptography>=44,<47"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx[socks]>=0.27,<1"]

[project.scripts]
mdt-demo = "mdt_demo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
