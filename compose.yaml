services:
  mongodb:
    image: mongo:8.0
    command: [mongod, --replSet, mdt-rs, --bind_ip_all, --port, '27018']
    ports:
      - '127.0.0.1:27018:27018'
    volumes:
      - mdt_mongodb:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --port 27018 --quiet --eval
          'try { rs.status() } catch (e) { if (e.code === 94) rs.initiate({_id:"mdt-rs",members:[{_id:0,host:"localhost:27018"}]}); else throw e; }
          if (!db.hello().isWritablePrimary) quit(1);'
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  mdt_mongodb:
